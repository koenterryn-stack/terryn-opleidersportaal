<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verstrekkersportaal — Terryn CommV</title>
<style>
  :root{--navy:#143055;--teal:#1f9e8f;--bg:#f5f7fa;--line:#e3e8ef;--ink:#1a2433;--muted:#5b6777;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  header{background:var(--navy);color:#fff;padding:20px 24px}
  header b{font-size:18px;letter-spacing:.3px}
  .wrap{max-width:760px;margin:0 auto;padding:24px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:18px}
  h1{font-size:22px;margin:.2em 0 .1em}
  .sub{color:var(--muted);margin-bottom:8px}
  .banner{background:#eef6f5;border:1px solid #cfe8e4;color:#0f6b60;border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:18px}
  label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
  input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
  textarea{min-height:70px;resize:vertical}
  .row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:120px}
  .hint{font-size:12px;color:var(--muted);margin-top:3px}
  .sec-title{font-weight:700;margin:4px 0 2px;font-size:15px}
  .chk{display:flex;align-items:center;gap:8px;padding:5px 0;font-weight:400;font-size:14px}
  .chk input{width:auto}
  .grp{font-weight:700;font-size:12px;color:var(--teal);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 4px;border-top:1px solid var(--line);padding-top:10px}
  .erk{display:flex;gap:8px;margin:6px 0}
  .erk select{flex:0 0 42%}.erk input{flex:1}
  .loc{border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;background:#fbfcfe;position:relative}
  .loc .x{position:absolute;top:8px;right:10px;cursor:pointer;color:var(--muted);font-size:18px;border:0;background:none}
  .addbtn{background:#eef2f7;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit;margin-top:6px}
  .submit{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer;width:100%}
  .submit:disabled{opacity:.5;cursor:default}
  .foot{color:var(--muted);font-size:12px;text-align:center;padding:10px 0 30px;line-height:1.6}
  .ok{background:#e9f8ee;border:1px solid #bfe7cb;color:#17663a;border-radius:10px;padding:16px;font-weight:600}
  .err{background:#fdecec;border:1px solid #f3c2c2;color:#9a2222;border-radius:10px;padding:12px;margin-bottom:12px}
  .tag{display:inline-block;background:#eef2f7;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted);margin-left:8px}
  .filter{position:sticky;top:0;background:#fff;padding-bottom:6px}
  .aanbodbox{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 12px;margin-top:8px}
</style>
</head>
<body>
<header><b>Terryn CommV</b> &nbsp;·&nbsp; verstrekkersportaal</header>
<div class="wrap">
  <div id="app"><p class="sub">Laden…</p></div>
  <div class="foot">
    Je gegevens worden verzameld door <b>Terryn CommV</b> (ondernemingsnummer BE 0887.986.696, Stokrooieweg 23, 3511 Hasselt)
    voor een op te bouwen overzicht van veiligheidsopleidingen in België.<br>
    Vragen of verwijdering? Antwoord op de uitnodiging die je ontving.
  </div>
</div>
<script>
// Functie-URL ingebakken: de token-link heeft enkel ?token nodig.
const API = "https://xbipxspmacsyjsfcgnxy.supabase.co/functions/v1/onboarding";
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const app = document.getElementById("app");

// ---- demo (preview zonder token) ----
const DEMO = {
  verstrekker:{id:"baav",naam:"Voorbeeld-opleider",adres:"Voorbeeldstraat 1",postcode:"3511",city:"Hasselt",prov:"Nationaal",
    contact_email:"info@voorbeeld.be",url:"https://www.voorbeeld.be",langs:["NL"],
    omschrijving:"Voorbeeldgegevens — in de echte link staan je eigen gegevens voor-ingevuld."},
  opleidingen:[
    {id:"code95::Defensief rijden (code 95)",label:"Defensief rijden (code 95)",vertical_label:"Code 95"},
    {id:"code95::Nascholing vakbekwaamheid (code 95)",label:"Nascholing vakbekwaamheid (code 95)",vertical_label:"Code 95"},
    {id:"vca::VCA basis",label:"VCA basis",vertical_label:"VCA & basisveiligheid"},
    {id:"mobiel::Vorkheftruck",label:"Vorkheftruck",vertical_label:"Mobiele arbeidsmiddelen"},
    {id:"pa::Preventieadviseur niveau III",label:"Preventieadviseur niveau III",vertical_label:"Preventieadviseur & psychosociaal"}
  ],
  aanbod:["vca::VCA basis"],
  locaties:[], pre_fill:{erkenningen:[]}, status:"preview"
};

function esc(s){return (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function render(d){
  const v=d.verstrekker||{}, langs=(v.langs||[]);
  const opl=d.opleidingen||[], aanbodSet=new Set(d.aanbod||[]);
  // groepeer opleidingen per vertical_label
  const groups={}; opl.forEach(o=>{(groups[o.vertical_label||"Overig"]=groups[o.vertical_label||"Overig"]||[]).push(o);});
  const aanbodHtml = opl.length ? `
     <input class="filter" id="oplfilter" placeholder="filter opleiding…" oninput="filterOpl()">
     <div class="aanbodbox" id="aanbodbox">
     ${Object.keys(groups).map(g=>`<div class="grp">${esc(g)}</div>`+groups[g].map(o=>
       `<label class="chk oplrow" data-l="${esc((o.label||'').toLowerCase())}"><input type="checkbox" class="aan" data-opl="${esc(o.id)}" ${aanbodSet.has(o.id)?"checked":""}> ${esc(o.label)}</label>`).join("")).join("")}
     </div>`
   : (d.pre_fill?.aanbod||[]).map(a=>`<label class="chk"><input type="checkbox" class="aan" data-opl="${esc(a.opleiding)}" checked> ${esc(a.opleiding.split("::").pop())}</label>`).join("") || '<p class="hint">Nog niets gevonden — je kan dit straks aanvullen.</p>';

  app.innerHTML = `
  <div class="banner">👋 Welkom, <b>${esc(v.naam)}</b>! Terryn CommV stelt een overzicht samen van wie in België opleidingen geeft rond veiligheid en welzijn op het werk — en jij staat op de lijst.
     Om je aanbod correct te tonen, vulden we alvast in wat we op je website vonden. <b>Kijk het even na, verbeter waar nodig en vink je opleidingen aan</b> — in een paar minuten ben je klaar.
     ${d.status==="preview"?'<span class="tag">preview</span>':""}</div>

  <div class="card">
    <div class="sec-title">Contactgegevens</div>
    <label>Naam</label><input id="naam" value="${esc(v.naam)}">
    <label>E-mail</label><input id="contact_email" value="${esc(v.contact_email)}">
    <label>Website</label><input id="url" value="${esc(v.url)}">
    <label>Talen waarin je opleidt</label>
    <div class="row">${["NL","FR","EN","DE"].map(l=>`<label class="chk"><input type="checkbox" class="lang" value="${l}" ${langs.includes(l)?"checked":""}> ${l}</label>`).join("")}</div>
    <label>Korte omschrijving</label><textarea id="omschrijving">${esc(v.omschrijving)}</textarea>
  </div>

  <div class="card">
    <div class="sec-title">Vestiging(en)</div>
    <div class="hint">Waar geef je opleiding? Voeg elke vaste locatie toe (voor in-company hoef je niets in te vullen). Elke locatie krijgt een kaartpin.</div>
    <div id="locs"></div>
    <button class="addbtn" type="button" onclick="addLoc()">+ vestiging toevoegen</button>
  </div>

  <div class="card">
    <div class="sec-title">Je opleidingsaanbod</div>
    <div class="hint">Aangevinkt staat wat we zagen. Vink bij wat je nog aanbiedt, of haal weg wat niet klopt.</div>
    ${aanbodHtml}
  </div>

  <div class="card">
    <div class="sec-title">Erkenningen <span class="tag">optioneel</span></div>
    <div class="hint">Enkel met een officieel nummer (BESACC-VCA, FOD WASO, Code 95/MOW, ADR-ITLB, VOV/ODB, sectorfonds, PC).</div>
    <div id="erk"></div>
    <button class="addbtn" type="button" onclick="addErk()">+ erkenning toevoegen</button>
  </div>

  <div id="msg"></div>
  <button class="submit" id="go" onclick="submit()">Bevestigen</button>`;

  (d.locaties||[]).forEach(l=>addLoc(l));
  (d.pre_fill?.erkenningen||[]).forEach(e=>addErk(e));
}

function filterOpl(){const q=(document.getElementById("oplfilter").value||"").toLowerCase();
  document.querySelectorAll(".oplrow").forEach(r=>{r.style.display=r.dataset.l.includes(q)?"":"none";});}

function addLoc(l={}){
  const d=document.createElement("div"); d.className="loc";
  d.innerHTML=`<button class="x" type="button" onclick="this.parentNode.remove()">×</button>
    <label>Naam locatie <span class="hint">(optioneel)</span></label><input class="l-label" value="${esc(l.label||"")}" placeholder="bv. Opleidingscentrum Gent">
    <div class="row">
      <div><label>Adres</label><input class="l-adres" value="${esc(l.adres||"")}"></div>
      <div style="flex:0 0 110px"><label>Postcode</label><input class="l-pc" value="${esc(l.postcode||"")}"></div>
      <div><label>Gemeente</label><input class="l-city" value="${esc(l.city||"")}"></div>
    </div>`;
  document.getElementById("locs").appendChild(d);
}

function addErk(e={}){
  const d=document.createElement("div"); d.className="erk";
  d.innerHTML=`<select>
     ${[["","— type —"],["besacc_csm","BESACC-VCA"],["fod_waso","FOD WASO"],["code95","Code 95 / MOW"],["adr_itlb","ADR-ITLB"],["vov_odb","VOV/ODB"],["sectorfonds","Sectorfonds"],["pc","PC-nummer"]]
       .map(([v,l])=>`<option value="${v}" ${e.type===v?"selected":""}>${l}</option>`).join("")}
   </select><input placeholder="nummer" value="${esc(e.nummer||"")}">`;
  document.getElementById("erk").appendChild(d);
}

async function geocode(adres,pc,city){
  try{const q=`street=${encodeURIComponent(adres)}&city=${encodeURIComponent(city)}&postalcode=${encodeURIComponent(pc)}&countrycodes=be&format=json&limit=1`;
    const r=await fetch(`https://nominatim.openstreetmap.org/search?${q}`).then(r=>r.json());
    if(r&&r[0]) return {lat:parseFloat(r[0].lat),lng:parseFloat(r[0].lon)};}catch(e){}
  return {};
}

async function submit(){
  const go=document.getElementById("go"); go.disabled=true; go.textContent="Bezig…";
  const val=id=>document.getElementById(id)?.value.trim();
  const velden={naam:val("naam"),contact_email:val("contact_email"),url:val("url"),omschrijving:val("omschrijving"),
    langs:[...document.querySelectorAll(".lang:checked")].map(x=>x.value)};
  // vestigingen (met geocode per locatie)
  const locaties=[];
  for(const row of document.querySelectorAll("#locs .loc")){
    const label=row.querySelector(".l-label").value.trim(), adres=row.querySelector(".l-adres").value.trim(),
      postcode=row.querySelector(".l-pc").value.trim(), city=row.querySelector(".l-city").value.trim();
    if(!adres && !city) continue;
    const g=await geocode(adres,postcode,city);
    locaties.push({label,adres,postcode,city,lat:g.lat,lng:g.lng});
  }
  // hoofd-pin = eerste vestiging (indien er een is)
  if(locaties[0]&&locaties[0].lat){velden.adres=locaties[0].adres;velden.postcode=locaties[0].postcode;velden.city=locaties[0].city;velden.lat=locaties[0].lat;velden.lng=locaties[0].lng;}
  const aanbod=[...document.querySelectorAll(".aan:checked")].map(x=>({opleiding:x.dataset.opl,leervorm:"beide"}));
  const erkenningen=[...document.querySelectorAll("#erk .erk")].map(r=>({type:r.querySelector("select").value,nummer:r.querySelector("input").value.trim()})).filter(e=>e.type&&e.nummer);
  const body={token:TOKEN,velden,aanbod,erkenningen,locaties};
  const msg=document.getElementById("msg");
  if(!API||!TOKEN){ msg.innerHTML=`<div class="ok">✓ Preview — dit zou nu verzonden worden:<pre style="white-space:pre-wrap;font-size:12px">${esc(JSON.stringify(body,null,2))}</pre></div>`; go.style.display="none"; return; }
  try{
    const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
    if(r.ok){ app.innerHTML=`<div class="ok">✓ Bedankt! Je gegevens zijn correct geregistreerd.</div>`; }
    else { const e=await r.json().catch(()=>({})); msg.innerHTML=`<div class="err">Er ging iets mis: ${esc(e.error||r.status)}</div>`; go.disabled=false; go.textContent="Bevestigen"; }
  }catch(e){ msg.innerHTML=`<div class="err">Netwerkfout. Probeer later opnieuw.</div>`; go.disabled=false; go.textContent="Bevestigen"; }
}

(async ()=>{
  if(API && TOKEN){
    try{ const d=await fetch(`${API}?token=${encodeURIComponent(TOKEN)}`).then(r=>r.json());
      if(d.error){ app.innerHTML=`<div class="err">${esc(d.error)}</div>`; return; }
      render(d);
    }catch(e){ app.innerHTML=`<div class="err">Kon de gegevens niet laden (${esc(String(e))}).</div>`; }
  } else { render(DEMO); }
})();
</script>
</body>
</html>
